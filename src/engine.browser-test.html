<!DOCTYPE html>
<html>
<head>
  <title>Mezzo Engine Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #eaeaea; }
    .pass { color: #4ecca3; }
    .fail { color: #ff6b6b; }
    .section { margin: 20px 0; padding: 10px; background: #25253d; border-radius: 8px; }
    h2 { margin-top: 0; }
  </style>
</head>
<body>
  <h1>Mezzo Engine Tests</h1>
  <div id="results"></div>

  <script type="module">
    import {
      MezzoEngine,
      FRAME_MS,
      ZONE_SILENCE_RATIO,
      ZONE_TARGET_MULT,
      ZONE_ACCEPTABLE_MULT,
      INITIAL_GRACE_MS_MIN,
      INITIAL_GRACE_MS_MAX,
    } from './engine.js';

    const results = document.getElementById('results');
    let passed = 0;
    let failed = 0;

    function log(msg, isPass) {
      const div = document.createElement('div');
      div.className = isPass ? 'pass' : 'fail';
      div.textContent = (isPass ? '✓ ' : '✗ ') + msg;
      results.appendChild(div);
      if (isPass) passed++; else failed++;
    }

    function section(name) {
      const div = document.createElement('div');
      div.className = 'section';
      div.innerHTML = `<h2>${name}</h2>`;
      results.appendChild(div);
      return div;
    }

    function assert(condition, msg) {
      if (condition) {
        log(msg, true);
      } else {
        log(msg, false);
      }
    }

    function processForDuration(engine, rms, durationMs) {
      const frames = Math.ceil(durationMs / FRAME_MS);
      for (let i = 0; i < frames; i++) {
        engine.processFrame(rms);
      }
    }

    function skipGracePeriod(engine, quietRms = 0.01) {
      const maxGraceFrames = Math.ceil(INITIAL_GRACE_MS_MAX / FRAME_MS) + 1;
      for (let i = 0; i < maxGraceFrames; i++) {
        engine.processFrame(quietRms);
      }
    }

    function createCalibratedEngine(baseline = 0.1) {
      const engine = new MezzoEngine();
      const samples = Array(20).fill(baseline);
      engine.calibrate(samples);
      return engine;
    }

    function readyEngine(baseline = 0.1) {
      const engine = createCalibratedEngine(baseline);
      engine.startMonitoring();
      skipGracePeriod(engine, baseline * 0.1);
      return engine;
    }

    // Calibration Tests
    section('Calibration');
    try {
      const e1 = new MezzoEngine();
      e1.calibrate([]);
      log('Should fail with no samples', false);
    } catch (err) {
      assert(err.message.includes('no samples'), 'Fails with no samples');
    }

    try {
      const e2 = new MezzoEngine();
      e2.calibrate(Array(20).fill(0));
      log('Should fail with silence-only', false);
    } catch (err) {
      assert(err.message.includes('silence'), 'Fails with silence-only input');
    }

    {
      const e3 = new MezzoEngine();
      e3.calibrate(Array(20).fill(0.1));
      assert(Math.abs(e3.baselineRMS - 0.1) < 1e-9, 'Sets correct baselineRMS');
      assert(e3.calibrationComplete === true, 'Marks calibration complete');
    }

    // Zone Classification Tests — immediate, no debounce (real voice moves
    // through intermediate zones faster than any dwell-time window would catch).
    section('Zone Classification');
    {
      const baseline = 0.1;
      const e = readyEngine(baseline);
      e.processFrame(baseline * (ZONE_SILENCE_RATIO - 0.05));
      assert(e.getZone() === 0, 'Below silence ratio -> zone 0 (Listening)');
    }

    {
      const baseline = 0.1;
      const e = readyEngine(baseline);
      e.processFrame(baseline);
      assert(e.getZone() === 1, 'At calibrated level -> zone 1 (Within Range, target)');
    }

    {
      const baseline = 0.1;
      const e = readyEngine(baseline);
      e.processFrame(baseline * (ZONE_TARGET_MULT + 0.05));
      assert(e.getZone() === 2, 'Just above target -> zone 2 (Within Range, acceptable)');
    }

    {
      const baseline = 0.1;
      const e = readyEngine(baseline);
      e.processFrame(baseline * (ZONE_ACCEPTABLE_MULT + 0.05));
      assert(e.getZone() === 3, 'Just above acceptable -> zone 3 (Outside of Range)');
    }

    {
      const baseline = 0.1;
      const e = readyEngine(baseline);
      e.processFrame(baseline * (ZONE_ACCEPTABLE_MULT + 10));
      assert(e.getZone() === 3, 'Zone 3 is open-ended — stays 3 arbitrarily far above the acceptable threshold');
    }

    {
      const baseline = 0.1;
      const e = readyEngine(baseline);
      const b = e.baselineRMS;
      const rampRatios = [0.5, 1.0, 1.5, 2.3];
      const expectedZones = [1, 1, 2, 3];
      let allMatched = true;
      rampRatios.forEach((ratio, i) => {
        e.processFrame(b * ratio);
        if (e.getZone() !== expectedZones[i]) allMatched = false;
      });
      assert(allMatched, 'A fast rise passes through every intermediate zone, one frame each');
    }

    // Recovery Tests
    section('Recovery');
    {
      const baseline = 0.1;
      const e = readyEngine(baseline);
      e.processFrame(0.2);
      e.processFrame(0.1);
      assert(e.getZone() === 1, 'Returns to a lower zone as soon as volume drops');
    }

    // Lifecycle Tests
    section('Lifecycle');
    {
      const e = new MezzoEngine();
      try {
        e.startMonitoring();
        log('Should fail without calibration', false);
      } catch (err) {
        assert(err.message.includes('calibration'), 'Cannot start without calibration');
      }
    }

    {
      const e = readyEngine(0.1);
      e.processFrame(0.2);
      e.stopMonitoring();
      assert(e.getZone() === 0, 'Stop resets zone');
    }

    {
      const e = createCalibratedEngine(0.1);
      e.startMonitoring();
      skipGracePeriod(e, 0.05);
      e.stopMonitoring();
      e.startMonitoring();
      assert(e.gracePeriodActive === true, 'Restart enters grace period');
    }

    // Grace Period Tests
    section('Grace Period');
    {
      const e = createCalibratedEngine(0.1);
      e.startMonitoring();
      for (let i = 0; i < 100; i++) {
        e.processFrame(0.5);
      }
      assert(e.getZone() === 0, 'No zone changes during grace period');
    }

    // Success Criteria
    section('Success Criteria');
    {
      const e = readyEngine(0.1);
      e.processFrame(0.1 * ZONE_ACCEPTABLE_MULT + 0.001);
      assert(e.getZone() === 3, 'Crossing the acceptable threshold escalates to Outside of Range immediately');
    }

    {
      const e = readyEngine(0.1);
      processForDuration(e, 0, 5000);
      assert(e.getZone() === 0, 'Silence equals zone 0 (Listening)');
    }

    // Summary
    const summary = section('Summary');
    summary.innerHTML += `<div class="${failed === 0 ? 'pass' : 'fail'}">
      ${passed} passed, ${failed} failed
    </div>`;
  </script>
</body>
</html>

<body data-surface="light" style="opacity: 0">

  <!-- ═══════════════════════════════════════════
       View 1: Active Monitoring (card UI)
       ═══════════════════════════════════════════ -->
  <div id="view-monitoring" class="page">
    <nav class="nav">
      <a href="index.html" class="type-nav-wordmark">Mezzo</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link nav-link-quiet">Home</a>
        <a href="privacy.html" class="nav-link nav-link-quiet">Privacy</a>
        <span class="nav-link nav-link-active">Try Mezzo</span>
      </div>
    </nav>

    <main class="mon-card-wrapper">
      <div class="mon-card">
        <button id="btn-pip" class="mon-pip-btn" aria-label="Pop out to Picture-in-Picture">
          <svg class="pip-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M13.5 1H2.5C1.67157 1 1 1.67157 1 2.5V9.5C1 10.3284 1.67157 11 2.5 11H13.5C14.3284 11 15 10.3284 15 9.5V2.5C15 1.67157 14.3284 1 13.5 1Z" stroke="currentColor" stroke-width="1.3"/>
            <path d="M14 6H9.5C8.94772 6 8.5 6.44772 8.5 7V10C8.5 10.5523 8.94772 11 9.5 11H14C14.5523 11 15 10.5523 15 10V7C15 6.44772 14.5523 6 14 6Z" fill="currentColor" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </button>
        <h1 class="mon-heading">Listening</h1>
        <div class="mon-circle-area">
          <div id="circle-container" class="mon-circle-container"></div>
        </div>
        <button id="btn-stop" class="btn-primary btn-wide">Stop listening</button>
        <p class="type-microcopy mon-micro">Nothing is recorded or saved.</p>
        <p class="type-microcopy mon-micro">Monitoring stops when you close this tab.</p>
      </div>
    </main>
  </div>

  <!-- ═══════════════════════════════════════════
       View 2: PiP Running (monitoring in mini window)
       ═══════════════════════════════════════════ -->
  <div id="view-pip-running" class="page hidden">
    <nav class="nav">
      <a href="index.html" class="type-nav-wordmark">Mezzo</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link nav-link-quiet">Home</a>
        <a href="privacy.html" class="nav-link nav-link-quiet">Privacy</a>
        <span class="nav-link nav-link-active">Try Mezzo</span>
      </div>
    </nav>

    <main class="mon-content">
      <img src="assets/pip-icon.svg" class="pip-running-icon" alt="" aria-hidden="true">
      <h1 class="type-section-heading pip-heading">Running in a mini window.</h1>
      <p class="type-body pip-body"><span class="mon-status-dot"></span>Monitoring is active. You can close this tab or bring it back here.</p>
      <button id="btn-return" class="btn-primary btn-wide">Return to this window</button>
      <p class="type-microcopy pip-micro">This will close the pop-out</p>
    </main>
  </div>

  <script src="monitoring.js" type="module"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mezzo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <h1 class="wordmark">Mezzo</h1>
    <p class="tagline">No recording. No transcription. Just volume.</p>

    <button id="btn-open-monitoring" class="btn-primary">Open Companion</button>

    <div class="popup-links">
      <a id="link-privacy" class="popup-link" href="#">Privacy</a>
      <button id="btn-settings" class="popup-link popup-link-button" type="button">Settings</button>
    </div>

    <div id="settings-panel" class="settings-panel hidden">
      <p class="settings-note">More settings coming soon.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

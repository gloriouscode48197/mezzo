<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mezzo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" data-state="not-running">
    <div class="popup-head">
      <h1 class="wordmark">mezzo</h1>
      <!-- What's open: Tab open / Companion open / Monitoring (lib/popup-state.js). -->
      <p class="status-chip" hidden><span class="status-dot" aria-hidden="true"></span><span class="status-label"></span></p>
    </div>

    <!-- One body, one button, one optional note; their text and look come
         from the state (lib/popup-state.js), so the four states can't drift. -->
    <section class="state" aria-live="polite">
      <p class="lede"></p>
      <button id="btn-popup-action" type="button" class="btn-primary"></button>
      <p class="note" hidden></p>
    </section>

    <nav class="popup-links" aria-label="More">
      <a id="link-privacy" class="popup-link" href="#">Privacy</a>
      <button id="btn-settings" class="popup-link" type="button" aria-expanded="false" aria-controls="settings-panel">Settings</button>
    </nav>

    <div id="settings-panel" class="settings-panel" hidden>
      <p class="settings-note">More settings coming soon.</p>
      <!-- Developer installs only (see lib/mezzo-url.js). -->
      <form id="dev-url-form" class="dev-url" hidden>
        <label class="dev-url-label" for="dev-url-input">Mezzo address (developer)</label>
        <input id="dev-url-input" class="dev-url-input" type="url" placeholder="https://mezzo-one.vercel.app" spellcheck="false" autocomplete="off">
        <div class="dev-url-actions">
          <button id="dev-url-save" class="btn-outline btn-small" type="submit">Save</button>
          <button id="dev-url-reset" class="popup-link" type="button">Use live site</button>
        </div>
        <p id="dev-url-status" class="settings-note" role="status"></p>
      </form>
    </div>
  </main>

  <script src="popup.js" type="module"></script>
</body>
</html>

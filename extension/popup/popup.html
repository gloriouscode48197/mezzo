<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mezzo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" data-state="not-running">
    <div class="popup-head">
      <h1 class="wordmark">mezzo</h1>
      <p class="open-label" hidden><span class="open-dot" aria-hidden="true"></span>Open</p>
    </div>

    <!-- Not running: Mezzo has no window open. -->
    <section class="state state-not-running">
      <p class="lede">A gentle nudge when you're talking louder than you'd like.</p>
      <button id="btn-open-mezzo" type="button" class="btn-primary">Open Mezzo</button>
      <p class="note">Opens in its own window. Only measures volume.</p>
    </section>

    <!-- Running: Mezzo's window exists. -->
    <section class="state state-running" hidden>
      <p class="lede">Mezzo is open in its own window.</p>
      <button id="btn-show-mezzo" type="button" class="btn-outline">Show Mezzo window</button>
    </section>

    <nav class="popup-links" aria-label="More">
      <a id="link-privacy" class="popup-link" href="#">Privacy</a>
      <button id="btn-settings" class="popup-link" type="button" aria-expanded="false" aria-controls="settings-panel">Settings</button>
    </nav>

    <div id="settings-panel" class="settings-panel" hidden>
      <p class="settings-note">More settings coming soon.</p>
    </div>
  </main>

  <script src="popup.js" type="module"></script>
</body>
</html>
